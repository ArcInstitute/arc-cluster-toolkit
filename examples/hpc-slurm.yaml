---

blueprint_name: hpc-slurm

# Remote state so this cluster can be deployed from any machine, not just the
# laptop that first ran gcluster. Bucket is versioned, so a corrupted or
# truncated state can be rolled back to a previous generation.
# gcluster derives the object prefix automatically as
# "hpc-slurm/${var.deployment_name}/primary" (pkg/config/expand.go).
terraform_backend_defaults:
  type: gcs
  configuration:
    bucket: arc-cyto-tfstate

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: hpc-slurm
  # Whole cluster lives in us-west1, co-located with the illumina-auto-demux
  # bucket (the only single-region bucket; the other four are US multi-region
  # and read fine from here). This replaces the earlier split-region setup,
  # where cross-region /home cost ~200x on Python startup and cross-zone
  # controller resolution needed a project-wide VmDnsSetting override.
  region: us-west1
  zone: us-west1-b
  enable_cleanup_compute: true
  ultima_bucket_name: ultima-auto-demux

# Documentation for each of the modules used below can be found at
# https://github.com/GoogleCloudPlatform/hpc-toolkit/blob/main/modules/README.md

deployment_groups:
- group: primary
  modules:
  # Source is an embedded module, denoted by "modules/*" without ./, ../, /
  # as a prefix. To refer to a local module, prefix with ./, ../ or /
  # Single subnet in vars.region again. The explicit two-subnet list, and the
  # description-ForceNew workaround it needed, existed only to bridge
  # us-east1/us-west1 and are unnecessary now the cluster is in one region.
  - id: network
    source: modules/network/vpc

  # BASIC_HDD capacity can be raised in place (and never lowered). Was 1024 GB
  # and sitting at 84% full, which is tight for the only shared writable
  # filesystem on the cluster.
  - id: homefs
    source: modules/file-system/filestore
    use: [network]
    settings:
      local_mount: /home
      size_gb: 5120

  - id: ultima-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: $(vars.ultima_bucket_name)
      fs_type: gcsfuse
      local_mount: /mnt/$(vars.ultima_bucket_name)
      # Bucket will be read only.
      mount_options: defaults,_netdev,implicit_dirs,allow_other,ro

  - id: illumina-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: illumina-auto-demux
      fs_type: gcsfuse
      local_mount: /mnt/illumina-auto-demux
      # Bucket will be read only.
      mount_options: defaults,_netdev,implicit_dirs,allow_other,ro
  
  - id: cellranger-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: arc-ctc-cellranger
      fs_type: gcsfuse
      local_mount: /mnt/arc-ctc-cellranger
      mount_options: defaults,_netdev,implicit_dirs,allow_other,dir_mode=0777,file_mode=766
  
  - id: arc-binseq-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: arc-binseq
      fs_type: gcsfuse
      local_mount: /mnt/arc-binseq
      mount_options: defaults,_netdev,implicit_dirs,allow_other,dir_mode=0777,file_mode=766

  - id: arc-cyto-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: arc-cyto
      fs_type: gcsfuse
      local_mount: /mnt/arc-cyto
      mount_options: defaults,_netdev,implicit_dirs,allow_other,dir_mode=0777,file_mode=766


  - id: ssh_script
    source: modules/scripts/startup-script
    settings:
      configure_ssh_host_patterns: ['hpcslurm-*']
      runners:
      - type: shell
        destination: install_uv.sh
        content: |
          #!/bin/bash
          # Install uv cluster-wide so users don't each bootstrap their own copy.
          #
          # Pinned, not "latest": compute nodes are ephemeral and boot
          # continuously, so an unpinned install would leave nodes started weeks
          # apart running different uv builds.
          #
          # Never fatal. A failing startup script takes slurmd with it and
          # slurm-gcp deletes the VM before the log can be read, which surfaces
          # as an unexplained ResumeTimeout. A transient astral.sh outage must
          # not cost us a node, so every failure path still exits 0.
          #
          # Symlinked into /usr/local/bin rather than exported via
          # /etc/profile.d: profile.d is sourced only by LOGIN shells, but
          # sbatch job scripts run as non-login shells whose PATH is
          # /usr/local/bin:/usr/bin -- profile.d alone would leave uv missing
          # inside every batch job.
          set -u
          UV_VERSION=0.12.15
          INSTALL_DIR=/opt/uv/bin

          if [ -x "${INSTALL_DIR}/uv" ] && "${INSTALL_DIR}/uv" --version 2>/dev/null | grep -qw "${UV_VERSION}"; then
            echo "uv ${UV_VERSION} already present, skipping download"
          else
            mkdir -p "${INSTALL_DIR}"
            if curl -LsSf --retry 3 --retry-delay 2 --max-time 120 \
                 "https://astral.sh/uv/${UV_VERSION}/install.sh" \
               | env UV_INSTALL_DIR="${INSTALL_DIR}" INSTALLER_NO_MODIFY_PATH=1 sh; then
              echo "uv ${UV_VERSION} installed to ${INSTALL_DIR}"
            else
              echo "WARNING: uv install failed; continuing so slurmd still starts" >&2
            fi
          fi

          for b in uv uvx; do
            [ -x "${INSTALL_DIR}/${b}" ] && ln -sfn "${INSTALL_DIR}/${b}" "/usr/local/bin/${b}"
          done

          exit 0


  - id: debug_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network,ssh_script]
    settings:
      node_count_dynamic_max: 4
      machine_type: n2-standard-4
      enable_placement: false # the default is: true
      allow_automatic_updates: false

  - id: debug_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - debug_nodeset
    settings:
      partition_name: debug
      exclusive: false # allows nodes to stay up after jobs are done
      is_default: true

  # Compute partitions are Intel C4, not AMD C2D, because `cyto` requires
  # AVX-512 and dies with SIGILL on AMD EPYC. Verified 2026-09-09 by running
  # `cyto --version` on one node of each family: works on n2 and c4 (Intel,
  # avx512f/dq/bw/vl present), core-dumps on c2d-standard-56 (EPYC 7B13, no
  # avx512 flags at all). Tiffany's cyto_FLP021 failed this way after staging
  # 1.7 TB. C4 is also newer and higher-core than the c2d it replaces.
  # C4 is Hyperdisk-only, so disk_type cannot be pd-ssd.
  - id: md_compute_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network,ssh_script]
    settings:
      node_count_dynamic_max: 40
      machine_type: c4-standard-96  # 96 vCPU / 48 Slurm cores / 360 GB (was c2d-standard-56: 28 cores / 224 GB)
      disk_type: hyperdisk-balanced
      disk_size_gb: 10240
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false

  - id: md_compute_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - md_compute_nodeset
    settings:
      partition_name: computemedium

  - id: bg_compute_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network,ssh_script]
    settings:
      node_count_dynamic_max: 40
      machine_type: c4-standard-192  # 192 vCPU / 96 Slurm cores / 720 GB (was c2d-standard-112: 56 cores / 448 GB)
      disk_type: hyperdisk-balanced  # C4 is Hyperdisk-only
      disk_size_gb: 10240
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false

  - id: bg_compute_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - bg_compute_nodeset
    settings:
      partition_name: computelarge

  # Big-memory partitions, on C4 (Granite Rapids / Emerald Rapids Xeon) — the
  # newest family offered in us-west1-b, and the highest vCPU count available at
  # these memory sizes. C4 is Hyperdisk-only: pd-ssd is rejected at instance
  # creation ("pd-ssd disk type cannot be used by c4-* machine type"), so
  # disk_type must be hyperdisk-balanced.
  # C4 CPUs per project per region in us-west1 is 888 vCPU, shared by all four
  # C4 nodesets (computemedium, computelarge, bigmem1t, bigmem2t): e.g. 4
  # computelarge nodes, or 2 computelarge + 5 computemedium. The ask for 12672
  # (every nodeset at node_count_dynamic_max) was denied 2026-09-15 for lack of
  # us-west1 capacity (support case 75266298), so 888 is the cap, not a
  # partial grant.
  # Boot disk is 10240 GB to match computemedium/computelarge, so a job that
  # stages reads on one partition doesn't run out of space on another (was
  # 2048; raised 2026-09-10 on Joseph Min's report). Note this is capacity
  # only: the nodeset module exposes no IOPS/throughput knobs, so all these
  # disks run Hyperdisk Balanced defaults regardless of size.
  # Second quota ceiling, easy to miss: Hyperdisk Balanced Capacity per
  # project per region in us-west1 is 180319 GB (2026-10-09), which backs 17
  # concurrent 10 TiB nodes across C4 *and* C4D. The 880640 GB ask was declined
  # (case 75321307, 2026-09-20); 333919 GB (+153600 for c4dhighmem) was filed
  # 2026-10-09 on quota preference hdb-capacity-us-west1. Hitting
  # either ceiling looks the same: the node goes down# with "GCP Error: Quota
  # ... exceeded", slurmsync returns it to idle~, and the job requeues onto
  # another C4 node that fails the same way, until running jobs free quota.
  # Placement groups are off: these are single-node, memory-bound jobs.
  - id: bigmem1t_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network, ssh_script]
    settings:
      node_count_dynamic_max: 4
      machine_type: c4-highmem-144  # 144 vCPU / 1116 GB
      disk_type: hyperdisk-balanced
      disk_size_gb: 10240
      bandwidth_tier: gvnic_enabled
      enable_placement: false
      allow_automatic_updates: false

  - id: bigmem1t_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - bigmem1t_nodeset
    settings:
      partition_name: bigmem1t

  - id: bigmem2t_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network, ssh_script]
    settings:
      node_count_dynamic_max: 2
      machine_type: c4-highmem-288  # 288 vCPU / 2232 GB
      disk_type: hyperdisk-balanced
      disk_size_gb: 10240
      bandwidth_tier: gvnic_enabled
      enable_placement: false
      allow_automatic_updates: false

  - id: bigmem2t_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - bigmem2t_nodeset
    settings:
      partition_name: bigmem2t

  # 1.5 TB partition on C4D (AMD Turin), added because us-west1 has no C4
  # capacity past 888 vCPU. The account team granted C4D CPUs per project per
  # region = 3000 vCPU (live 2026-10-09), i.e. 15 nodes of 192 vCPU. Turin has
  # AVX-512 (unlike C2D), so `cyto` runs. Its own partition, not a second
  # nodeset in computelarge: Slurm can't see GCP quota and would keep picking
  # C4 nodes that fail to resume. C4D is Hyperdisk-only, and these 10 TiB boot
  # disks share the Hyperdisk ceiling above with the C4 nodesets.
  - id: c4dhighmem_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network, ssh_script]
    settings:
      node_count_dynamic_max: 15
      machine_type: c4d-highmem-192  # 192 vCPU / 1512 GB
      disk_type: hyperdisk-balanced
      disk_size_gb: 10240
      bandwidth_tier: gvnic_enabled
      enable_placement: false
      allow_automatic_updates: false

  - id: c4dhighmem_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - c4dhighmem_nodeset
    settings:
      partition_name: c4dhighmem


  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      machine_type: n2-standard-4
      enable_login_public_ips: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - debug_partition
    - md_compute_partition
    - bg_compute_partition
    - bigmem1t_partition
    - bigmem2t_partition
    - c4dhighmem_partition
    - homefs
    - ultima-bucket
    - illumina-bucket
    - arc-binseq-bucket
    - arc-cyto-bucket
    - cellranger-bucket
    - slurm_login
    settings:
      enable_controller_public_ips: true
      # The five nodesets pick up ssh_script through their own `use`, but the
      # login node cannot: the startup-script module exposes startup_script,
      # compute_startup_script and controller_startup_script -- there is no
      # login_startup_script output for `use` to wire up. Without this explicit
      # line uv installs everywhere except the one machine users actually type
      # it on.
      login_startup_script: $(ssh_script.startup_script)
