---

blueprint_name: hpc-slurm

# Remote state so this cluster can be deployed from any machine, not just the
# laptop that first ran gcluster. Bucket is versioned, so a corrupted or
# truncated state can be rolled back to a previous generation.
# gcluster derives the object prefix automatically as
# "hpc-slurm/${var.deployment_name}/primary" (pkg/config/expand.go).
terraform_backend_defaults:
  type: gcs
  configuration:
    bucket: arc-cyto-tfstate

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: hpc-slurm
  region: us-east1
  zone: us-east1-b
  enable_cleanup_compute: true
  ultima_bucket_name: ultima-auto-demux

# Documentation for each of the modules used below can be found at
# https://github.com/GoogleCloudPlatform/hpc-toolkit/blob/main/modules/README.md

deployment_groups:
- group: primary
  modules:
  # Source is an embedded module, denoted by "modules/*" without ./, ../, /
  # as a prefix. To refer to a local module, prefix with ./, ../ or /
  # A second subnet in us-west1 so compute can sit in the same region as the
  # illumina-auto-demux bucket (us-west1) instead of reading it cross-country.
  # GCP VPCs are global, so both subnets live in one network and route
  # internally; the module creates a Cloud Router + NAT per distinct region
  # automatically (for_each over subnet regions), and the existing
  # allow-internal firewall rule already covers 10.0.0.0/9.
  #
  # DANGER: entry [0] is treated as the PRIMARY subnet and MUST reproduce the
  # live us-east1 subnet exactly (hpc-slurm-primary-subnet / 10.0.0.0/24) — the
  # controller, login node and Filestore all sit on it, and any drift here
  # replaces it. Both entries must use subnet_ip (never mix with new_bits, which
  # would recompute every CIDR); the module validates this, but keep it explicit.
  - id: network
    source: modules/network/vpc
    settings:
      subnetworks:
      - subnet_name: hpc-slurm-primary-subnet
        subnet_region: us-east1
        subnet_ip: 10.0.0.0/24
        subnet_private_access: "true"
        # description is ForceNew: the module's implicit-default path sets it to
        # "primary subnetwork in <network_name>", so omitting it here nulls the
        # field and replaces the live subnet (taking the controller and login
        # node with it). Verified via terraform plan replace_paths.
        description: primary subnetwork in hpc-slurm-net
      - subnet_name: hpc-slurm-west-subnet
        subnet_region: us-west1
        subnet_ip: 10.1.0.0/24
        subnet_private_access: "true"
        description: us-west1 subnetwork in hpc-slurm-net

  - id: homefs
    source: modules/file-system/filestore
    use: [network]
    settings:
      local_mount: /home

  - id: ultima-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: $(vars.ultima_bucket_name)
      fs_type: gcsfuse
      local_mount: /mnt/$(vars.ultima_bucket_name)
      # Bucket will be read only.
      mount_options: defaults,_netdev,implicit_dirs,allow_other,ro

  - id: illumina-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: illumina-auto-demux
      fs_type: gcsfuse
      local_mount: /mnt/illumina-auto-demux
      # Bucket will be read only.
      mount_options: defaults,_netdev,implicit_dirs,allow_other,ro
  
  - id: cellranger-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: arc-ctc-cellranger
      fs_type: gcsfuse
      local_mount: /mnt/arc-ctc-cellranger
      mount_options: defaults,_netdev,implicit_dirs,allow_other,dir_mode=0777,file_mode=766
  
  - id: arc-binseq-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: arc-binseq
      fs_type: gcsfuse
      local_mount: /mnt/arc-binseq
      mount_options: defaults,_netdev,implicit_dirs,allow_other,dir_mode=0777,file_mode=766

  - id: arc-cyto-bucket
    source: modules/file-system/pre-existing-network-storage
    settings:
      remote_mount: arc-cyto
      fs_type: gcsfuse
      local_mount: /mnt/arc-cyto
      mount_options: defaults,_netdev,implicit_dirs,allow_other,dir_mode=0777,file_mode=766


  - id: ssh_script
    source: modules/scripts/startup-script
    settings:
      configure_ssh_host_patterns: ['hpcslurm-*']


  - id: debug_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network,ssh_script]
    settings:
      node_count_dynamic_max: 4
      machine_type: n2-standard-4
      enable_placement: false # the default is: true
      allow_automatic_updates: false

  - id: debug_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - debug_nodeset
    settings:
      partition_name: debug
      exclusive: false # allows nodes to stay up after jobs are done
      is_default: true

  - id: md_compute_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network,ssh_script]
    settings:
      node_count_dynamic_max: 40
      machine_type: c2d-standard-56
      disk_type: pd-ssd
      disk_size_gb: 10240
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false

  - id: md_compute_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - md_compute_nodeset
    settings:
      partition_name: computemedium

  - id: bg_compute_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network,ssh_script]
    settings:
      node_count_dynamic_max: 40
      machine_type: c2d-standard-112
      disk_type: pd-ssd
      disk_size_gb: 10240
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false

  - id: bg_compute_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - bg_compute_nodeset
    settings:
      partition_name: computelarge

  # Big-memory partitions, on C4 (Granite Rapids / Emerald Rapids Xeon) — the
  # newest family in us-east1-b, and the highest vCPU count available at these
  # memory sizes. C4 is Hyperdisk-only: pd-ssd is rejected at instance creation
  # ("pd-ssd disk type cannot be used by c4-* machine type"), so disk_type must
  # be hyperdisk-balanced.
  # Requires a C4 CPUs per project per region quota increase in us-east1
  # (1152 vCPU to run both partitions at full node_count_dynamic_max).
  # Placement groups are off: these are single-node, memory-bound jobs.
  - id: bigmem1t_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network, ssh_script]
    settings:
      node_count_dynamic_max: 4
      machine_type: c4-highmem-144  # 144 vCPU / 1116 GB
      disk_type: hyperdisk-balanced
      disk_size_gb: 2048
      bandwidth_tier: gvnic_enabled
      enable_placement: false
      allow_automatic_updates: false

  - id: bigmem1t_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - bigmem1t_nodeset
    settings:
      partition_name: bigmem1t

  - id: bigmem2t_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network, ssh_script]
    settings:
      node_count_dynamic_max: 2
      machine_type: c4-highmem-288  # 288 vCPU / 2232 GB
      disk_type: hyperdisk-balanced
      disk_size_gb: 2048
      bandwidth_tier: gvnic_enabled
      enable_placement: false
      allow_automatic_updates: false

  - id: bigmem2t_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - bigmem2t_nodeset
    settings:
      partition_name: bigmem2t

  # us-west1 partition, co-located with the illumina-auto-demux bucket.
  # Reads of that bucket become same-region (no inter-region egress, full
  # throughput) instead of crossing the country on every job.
  #
  # TRADE-OFF, deliberate: /home is a Filestore in us-east1-b and Filestore
  # cannot span regions, so nodes here mount /home over ~65ms NFS. That is fine
  # for streaming reads but slow for metadata-heavy work (conda activation,
  # python imports, git). Hence the local-SSD /scratch below — stage from the
  # bucket into /scratch and do the work there, not in /home.
  - id: west_startup_script
    source: modules/scripts/startup-script
    settings:
      configure_ssh_host_patterns: ['hpcslurm-*']
      local_ssd_filesystem:
        fs_type: ext4
        mountpoint: /scratch
        permissions: "1777"

  - id: west_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [west_startup_script]
    settings:
      region: us-west1
      zone: us-west1-b
      subnetwork_self_link: $(network.subnetworks["us-west1/hpc-slurm-west-subnet"].self_link)
      node_count_dynamic_max: 20
      machine_type: c4-standard-96-lssd  # 96 vCPU / 360 GB + local SSD
      disk_type: hyperdisk-balanced      # C4 is Hyperdisk-only
      disk_size_gb: 200
      bandwidth_tier: gvnic_enabled
      enable_placement: false
      allow_automatic_updates: false

  - id: west_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - west_nodeset
    settings:
      partition_name: westdemux

  # us-west1 equivalent of bigmem1t, for memory-heavy work that also needs the
  # illumina-auto-demux bucket local. Same shape as bigmem1t (c4-highmem-144,
  # ~1098 GB usable) but on the -lssd variant so it gets /scratch, since /home
  # is cross-region here.
  - id: west_bigmem1t_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [west_startup_script]
    settings:
      region: us-west1
      zone: us-west1-b
      subnetwork_self_link: $(network.subnetworks["us-west1/hpc-slurm-west-subnet"].self_link)
      node_count_dynamic_max: 4
      machine_type: c4-highmem-144-lssd  # 144 vCPU / 1116 GB + local SSD
      disk_type: hyperdisk-balanced      # C4 is Hyperdisk-only
      disk_size_gb: 200
      bandwidth_tier: gvnic_enabled
      enable_placement: false
      allow_automatic_updates: false

  - id: west_bigmem1t_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - west_bigmem1t_nodeset
    settings:
      partition_name: westbigmem1t

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      machine_type: n2-standard-4
      enable_login_public_ips: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - debug_partition
    - md_compute_partition
    - bg_compute_partition
    - bigmem1t_partition
    - bigmem2t_partition
    - west_partition
    - west_bigmem1t_partition
    - homefs
    - ultima-bucket
    - illumina-bucket
    - arc-binseq-bucket
    - arc-cyto-bucket
    - cellranger-bucket
    - slurm_login
    settings:
      enable_controller_public_ips: true
